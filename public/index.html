<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <meta name="theme-color" content="#1a1a2e" />

  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <title>血壓紀錄助手</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── Header ── */
    header {
      background: #1a1a2e;
      color: #fff;
      text-align: center;
      padding: 16px 12px;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      flex-shrink: 0;
      position: relative;
    }
    #reload-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      font-size: 1.2rem;
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      line-height: 1;
    }

    /* ── Transcript area ── */
    #transcript-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      background: #fff;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 1.4rem;
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 92%;
      word-break: break-word;
    }

    .bubble.btn1 { border-left: 5px solid #27ae60; }
    .bubble.btn2 { border-left: 5px solid #e74c3c; align-self: flex-end; }
    .bubble.error {
      background: #fff0f0;
      border-left-color: #c0392b;
      color: #c0392b;
      white-space: pre-line;
    }
    .bubble-datetime {
      font-size: 1.2rem;
      color: #aaa;
      margin-bottom: 4px;
    }
    .bubble-values {
      font-size: 1.4rem;
      font-weight: 700;
      color: #222;
      display: flex;
      gap: 18px;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .bubble-values .val-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .bubble-values .val-label {
      font-size: 1rem;
      font-weight: 600;
      color: #888;
      line-height: 1;
      margin-bottom: 2px;
    }
    .bubble-values .val-num {
      font-size: 1.4rem;
      font-weight: 900;
      line-height: 1;
    }
    .upload-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 1.2rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .upload-tag.ok   { background: #eafaf1; color: #27ae60; }
    .upload-tag.fail { background: #fff0f0; color: #c0392b; }

    /* ── Query result bubble ── */
    .bubble.query {
      border-left: 5px solid #2980b9;
      max-width: 100%;
      font-size: 0.92rem;
      padding: 12px 14px;
    }
    .bubble.query .query-title {
      font-weight: 700;
      font-size: 1rem;
      color: #2980b9;
      margin-bottom: 8px;
    }
    .bubble.query table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    .bubble.query th {
      text-align: left;
      color: #888;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 2px 6px 4px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .bubble.query td {
      padding: 3px 6px 3px 0;
      color: #333;
      border-bottom: 1px solid #f0f0f0;
    }
    .bubble.query .no-records {
      color: #aaa;
      font-style: italic;
    }

    #status {
      text-align: center;
      font-size: 1.2rem;
      color: #888;
      padding: 6px 0;
      min-height: 28px;
      flex-shrink: 0;
    }

    #status.recording {
      color: #e74c3c;
      font-weight: 600;
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    /* ── Bottom buttons ── */
    .btn-row {
      display: flex;
      gap: 4%;
      padding: 12px 3%;
      padding-bottom: max(64px, calc(env(safe-area-inset-bottom) + 36px));
      background: #fff;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }

    .record-btn {
      flex: 0 0 40%;
      height: clamp(80px, 18vw, 120px);
      border: none;
      border-radius: 18px;
      font-size: clamp(2.5rem, 12vw, 5rem);
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: transform 0.08s, filter 0.08s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }

    .record-btn:active,
    .record-btn.pressing {
      transform: scale(0.95);
      filter: brightness(0.85);
    }

    #btn1 { background: #27ae60; margin-left: auto; }
    #btn2 { background: #e74c3c; margin-right: auto; }
  </style>
</head>
<body>

  <header>
    血壓紀錄助手
    <button id="reload-btn" type="button" aria-label="清除快取並重新載入">&#x21BB;</button>
  </header>

  <div id="transcript-area"></div>

  <div id="status">按住按鈕開始錄音</div>
  <div class="btn-row">
    <button id="btn1" class="record-btn" type="button" aria-label="使用者一，按住錄音">1</button>
    <button id="btn2" class="record-btn" type="button" aria-label="使用者二，按住錄音">2</button>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const transcriptArea = document.getElementById('transcript-area');

    let recordingSession = null;
    let stream = null;

    async function getStream() {
      // Re-acquire if stream is missing or any track has ended (e.g. after screen lock / iOS interruption)
      const isLive = stream && stream.getTracks().every(t => t.readyState === 'live');
      if (!isLive) {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
      return stream;
    }

    function encodeWav(audioBuffer) {
      const samples = audioBuffer.getChannelData(0);
      const wav = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(wav);
      const writeText = (offset, text) => {
        for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
      };
      writeText(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeText(8, 'WAVE');
      writeText(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, 16000, true);
      view.setUint32(28, 32000, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeText(36, 'data');
      view.setUint32(40, samples.length * 2, true);
      for (let i = 0; i < samples.length; i++) {
        const sample = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(44 + i * 2, sample < 0 ? sample * 32768 : sample * 32767, true);
      }
      return new Blob([wav], { type: 'audio/wav' });
    }

    async function convertRecordingToWav(blob) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass || !window.OfflineAudioContext) throw new Error('瀏覽器不支援音訊轉換');
      const context = new AudioContextClass();
      try {
        const decoded = await context.decodeAudioData(await blob.arrayBuffer());
        const frameCount = Math.max(1, Math.ceil(decoded.duration * 16000));
        const offline = new OfflineAudioContext(1, frameCount, 16000);
        const source = offline.createBufferSource();
        source.buffer = decoded;
        source.connect(offline.destination);
        source.start();
        return encodeWav(await offline.startRendering());
      } finally {
        await context.close();
      }
    }

    async function startRecording(btn) {
      if (recordingSession) return;
      const session = { btn, recorder: null, chunks: [], cancelled: false };
      recordingSession = session;

      try {
        const s = await getStream();
        if (session.cancelled || recordingSession !== session) return;
        const mimeType = [
          'audio/webm;codecs=opus',
          'audio/webm',
          'audio/mp4',
          'audio/ogg;codecs=opus',
          'audio/ogg',
        ].find(type => MediaRecorder.isTypeSupported(type));
        session.recorder = mimeType ? new MediaRecorder(s, { mimeType }) : new MediaRecorder(s);
        session.recorder.ondataavailable = e => {
          if (e.data.size > 0) session.chunks.push(e.data);
        };
        session.recorder.start(100);

        btn.classList.add('pressing');
        statusEl.textContent = '● 錄音中…';
        statusEl.className = 'recording';
      } catch (err) {
        statusEl.textContent = '麥克風存取失敗：' + err.message;
        statusEl.className = '';
        if (recordingSession === session) recordingSession = null;
      }
    }

    async function stopRecording(btn) {
      const session = recordingSession;
      if (!session || session.btn !== btn) return;
      recordingSession = null;
      if (!session.recorder) {
        session.cancelled = true;
        statusEl.textContent = '按住按鈕開始錄音';
        return;
      }
      if (session.recorder.state === 'inactive') return;

      return new Promise(resolve => {
        session.recorder.onstop = async () => {
          btn.classList.remove('pressing');
          statusEl.textContent = '辨識中…';
          statusEl.className = '';

          const blob = new Blob(session.chunks, { type: session.recorder.mimeType });
          session.chunks = [];
          if (!blob.size) {
            statusEl.textContent = '錄音時間太短，請按住後再說話';
            resolve();
            return;
          }

          const formData = new FormData();
          let uploadBlob = blob;
          let filename = session.recorder.mimeType.includes('mp4') ? 'recording.m4a'
            : session.recorder.mimeType.includes('ogg') ? 'recording.ogg' : 'recording.webm';
          try {
            statusEl.textContent = '音訊轉換中…';
            uploadBlob = await convertRecordingToWav(blob);
            filename = 'recording.wav';
          } catch (error) {
            console.warn('WAV conversion unavailable; uploading original recording:', error);
          }
          formData.append('audio', uploadBlob, filename);
          formData.append('btnId', btn.id);

          try {
            const resp = await fetch('/transcribe', { method: 'POST', body: formData });
            const contentType = resp.headers.get('content-type') || '';
            if (!contentType.includes('application/json')) throw new Error('伺服器回應格式錯誤');
            const data = await resp.json();
            if (!resp.ok && !data.type) throw new Error(data.error || '伺服器錯誤');

            if (data.type === 'query') {
              if (data.error) {
                addErrorBubble(data.error, btn.id);
                statusEl.textContent = data.error;
              } else {
                addQueryBubble(data.label, data.records, btn.id);
                statusEl.textContent = `查詢完成：${data.label}，共 ${data.records.length} 筆`;
              }
            } else if (data.type === 'bp') {
              if (data.text) {
                addBubble(data.text, btn.id, data.error, data);
                statusEl.textContent = data.error || data.syncError || '按住按鈕開始錄音';
              } else {
                statusEl.textContent = '錯誤：' + (data.error || '未知錯誤');
              }
            } else {
              addErrorBubble(data.error || '無法理解語音內容', btn.id);
              statusEl.textContent = data.error || '無法理解語音內容';
            }
          } catch (e) {
            statusEl.textContent = '傳送失敗：' + e.message;
          }
          resolve();
        };
        session.recorder.stop();
      });
    }

    function addBubble(text, btnId, error, result) {
      const div = document.createElement('div');
      div.className = `bubble ${btnId}${error ? ' error' : ''}`;

      if (error) {
        const main = document.createElement('div');
        main.style.whiteSpace = 'pre-line';
        main.textContent = `${text}\n${error}`;
        div.appendChild(main);
      } else {
        // Line 1: datetime
        const now = new Date();
        const p = n => String(n).padStart(2, '0');
        const dtEl = document.createElement('div');
        dtEl.className = 'bubble-datetime';
        dtEl.textContent = `${now.getFullYear()}/${p(now.getMonth()+1)}/${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`;
        div.appendChild(dtEl);

        // Line 2: SYS / DIA / HR
        const parts = text.split(',');
        const valRow = document.createElement('div');
        valRow.className = 'bubble-values';
        [['SYS', parts[0]], ['DIA', parts[1]], ['HR', parts[2]]].forEach(([label, num]) => {
          const item = document.createElement('div');
          item.className = 'val-item';
          item.innerHTML = `<span class="val-label">${label}</span><span class="val-num">${num ?? '—'}</span>`;
          valRow.appendChild(item);
        });
        div.appendChild(valRow);

        // Line 3: local save and optional remote sync status
        const tag = document.createElement('div');
        tag.className = `upload-tag ${result.saved ? 'ok' : 'fail'}`;
        if (!result.saved) tag.textContent = '儲存失敗';
        else if (!result.syncConfigured) tag.textContent = '已保存';
        else if (result.synced) tag.textContent = '已保存並同步';
        else tag.textContent = '已保存，同步失敗';
        div.appendChild(tag);
      }

      transcriptArea.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    function addErrorBubble(msg, btnId) {
      const div = document.createElement('div');
      div.className = `bubble ${btnId} error`;
      div.textContent = msg;
      transcriptArea.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    function addQueryBubble(label, records, btnId) {
      const div = document.createElement('div');
      div.className = `bubble ${btnId} query`;

      const title = document.createElement('div');
      title.className = 'query-title';
      title.textContent = `${label}（${records.length} 筆）`;
      div.appendChild(title);

      if (records.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'no-records';
        empty.textContent = '此期間無記錄';
        div.appendChild(empty);
      } else {
        const table = document.createElement('table');
        table.innerHTML = `<tr>
          <th>日期時間</th>
          <th>收縮壓</th>
          <th>舒張壓</th>
          <th>心率</th>
        </tr>`;
        records.forEach(r => {
          const tr = document.createElement('tr');
          // Show date as MM/DD HH:mm
          const date = new Date(r.datetime);
          const dt = Number.isFinite(date.getTime())
            ? date.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
            : '日期錯誤';
          [dt, r.sys, r.dia, r.hr].forEach(value => {
            const td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        div.appendChild(table);
      }

      transcriptArea.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    // ── Attach pointer events (works for mouse + touch) ──
    ['btn1', 'btn2'].forEach(id => {
      const btn = document.getElementById(id);

      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        startRecording(btn);
      });

      btn.addEventListener('pointerup', e => {
        e.preventDefault();
        stopRecording(btn);
      });

      btn.addEventListener('pointercancel', e => {
        stopRecording(btn);
      });
    });

    document.getElementById('reload-btn').addEventListener('click', async () => {
      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names.map(name => caches.delete(name)));
      }
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration => registration.unregister()));
      }
      location.reload();
    });

    window.addEventListener('pagehide', () => {
      if (stream) stream.getTracks().forEach(track => track.stop());
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      // 測試期間停用 PWA，並清除先前註冊的 Service Worker。
      navigator.serviceWorker.getRegistrations()
        .then(registrations => Promise.all(registrations.map(registration => registration.unregister())));
    }
    if ('caches' in window) {
      caches.keys()
        .then(names => Promise.all(names.filter(name => name.startsWith('bp-')).map(name => caches.delete(name))));
    }
  </script>
</body>
</html>
